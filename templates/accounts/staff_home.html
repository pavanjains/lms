{% extends "base.html" %}
{% block content %}
<h1>Staff workspace</h1>
<p>Signed in as {{ request.user.email }}.</p>
<p>Multifactor verification completed.</p>
<p><a href="{% url 'classrooms:list' %}">Manage classes</a></p>
{% if request.user.role == "OWNER" %}
<p><a href="{% url 'owner-accounts:instructors' %}">Manage instructors and invitations</a></p>
{% endif %}
<p><a href="{% url 'two_factor:backup_tokens' %}">Manage recovery codes</a></p>
<form method="post" action="{% url 'staff-logout' %}">
  {% csrf_token %}<button type="submit">Sign out</button>
</form>
{% endblock %}
