<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stembotic | {% block title %}Robotics Learning Center{% endblock %}</title>
  <style>
    :root { --ink: #1b2a41; --page: #eef4fb; --frame: #b9d2ea; --brand: #0b3d91; --teal: #0e7c86; --link: #0b4fb3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5; }
    .skip-link { display: inline-block; padding: 0.4rem 0.8rem; color: var(--link); }
    .skip-link:focus, main:focus {
      outline: 3px solid #005fcc;
      outline-offset: 0.25rem;
    }
    .site-header { background: linear-gradient(120deg, #0b3d91, #0e7c86); color: #ffffff; padding: 1rem 1.5rem 0; border-bottom: 6px solid #f59e0b; }
    .site-header p { margin: 0; }
    .brand-name { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.02em; }
    .brand-tagline { color: #e6f4f6; }
    .site-nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0.25rem; margin: 1rem 0 0; padding: 0; }
    .site-nav a { display: block; padding: 0.55rem 1rem; color: #ffffff; background: rgba(255, 255, 255, 0.16); border-radius: 10px 10px 0 0; font-weight: 600; text-decoration: none; }
    .site-nav a:hover { background: rgba(255, 255, 255, 0.3); }
    .site-nav a[aria-current="page"] { background: #ffffff; color: #0b3d91; }
    .site-nav a:focus-visible { outline: 3px solid #ffd54a; outline-offset: 2px; }
    main { width: min(60rem, calc(100% - 2rem)); margin: 1.5rem auto; padding: 1.5rem 1.75rem; background: #ffffff; border: 2px solid var(--frame); border-top: 6px solid var(--teal); border-radius: 14px; box-shadow: 0 6px 18px rgba(11, 61, 145, 0.12); }
    h1 { margin-top: 0; padding-bottom: 0.4rem; color: var(--brand); border-bottom: 3px solid #f59e0b; }
    h2 { color: #0e5f69; }
    h2, h3 { padding-bottom: 0.3rem; border-bottom: 3px solid #f59e0b; }
    a { color: var(--link); }
    button { padding: 0.5rem 1.1rem; color: #ffffff; background: var(--link); border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
    button:hover { background: #083a85; }
    input, select, textarea { max-width: 100%; padding: 0.4rem 0.5rem; border: 2px solid #8fb3d6; border-radius: 8px; font: inherit; }
    input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }
    table { width: 100%; margin: 1rem 0; border-collapse: collapse; }
    th, td { padding: 0.5rem 0.65rem; border: 1px solid var(--frame); text-align: left; }
    th { color: #0b2f6b; background: #dcecfa; }
    tbody tr:nth-child(even) { background: #f6faff; }
    [role="alert"] { padding: 0.75rem 1rem; color: #7f1d1d; background: #fef2f2; border: 2px solid #b91c1c; border-radius: 10px; }
    [role="status"] { padding: 0.75rem 1rem; color: #14532d; background: #f0fdf4; border: 2px solid #15803d; border-radius: 10px; }
    .lead { font-size: 1.15rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; margin: 1.5rem 0; padding: 0; list-style: none; }
    .card { padding: 1rem 1.1rem; background: #ffffff; border: 2px solid var(--frame); border-top-width: 8px; border-radius: 12px; box-shadow: 0 4px 12px rgba(11, 61, 145, 0.1); }
    .card h2 { margin-top: 0; }
    .tone-amber { border-top-color: #b45309; }
    .tone-teal { border-top-color: #0e7490; }
    .tone-violet { border-top-color: #6d28d9; }
    .button-link { display: inline-block; padding: 0.55rem 1rem; color: #ffffff; border-radius: 8px; font-weight: 700; text-decoration: none; }
    .button-link:hover { text-decoration: underline; }
    .tone-amber .button-link { background: #b45309; }
    .tone-teal .button-link { background: #0e7490; }
    .tone-violet .button-link { background: #6d28d9; }
    .note { padding: 0.6rem 0.8rem; color: #334155; background: #f1f5f9; border: 2px dashed #94a3b8; border-radius: 8px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="brand"><p class="brand-name">Stembotic</p><p class="brand-tagline">Robotics Learning Center</p></div>
    <nav class="site-nav" aria-label="Site">
      <ul>
        <li><a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Home</a></li>
        {% if user.is_authenticated %}<li><a href="{% if user.role == 'STUDENT' %}{% url 'student-home' %}{% else %}{% url 'staff-home' %}{% endif %}">My workspace</a></li>{% endif %}
      </ul>
    </nav>
  </header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
</body>
</html>
