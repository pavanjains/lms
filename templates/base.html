<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stembotic | {% block title %}Robotics Learning Center{% endblock %}</title>
  <style>
    .skip-link:focus, main:focus {
      outline: 3px solid #005fcc;
      outline-offset: 0.25rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header><p>Stembotic</p><p>Robotics Learning Center</p></header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
</body>
</html>
